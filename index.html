<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌芽啦 留学 | 温馨陪伴 · 见证成长</title>
    <style>
        /* 1. 核心视觉定义 */
        :root {
            --apple-bg: #fcfaf2;        /* 温馨奶油背景 */
            --apple-card: rgba(255, 255, 255, 0.75);
            --apple-text: #1d1d1f;
            --apple-grey: #86868b;
            --accent-color: #5b21b6;    /* 品牌主色：深紫 */
        }

        body {
            background-color: var(--apple-bg);
            font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif;
            color: var(--apple-text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
        }

        /* 2. 容器与毛玻璃效果 */
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--apple-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center;
        }

        /* 3. 标题与文字排版 */
        .tag {
            display: inline-block;
            background: #fff4e6;
            color: #d97706;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #5b21b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: clamp(18px, 3vw, 22px);
            color: var(--apple-grey);
            max-width: 600px;
            margin: 0 auto 50px auto;
        }

        /* 4. 服务项目卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            text-align: left;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f0f0f0;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
        }

        .card-icon { font-size: 32px; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .card-desc { font-size: 14px; color: var(--apple-grey); }

        /* 5. 交互按钮 */
        .btn {
            display: inline-block;
            margin-top: 50px;
            background: var(--apple-text);
            color: white;
            padding: 16px 36px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="tag">🇨🇦 落地加拿大十年 · 更有温度的守护</div>
        <h1>Alpha 留学</h1>
        <p class="subtitle">我们不仅提供课程与咨询，更在北美为你的孩子寻找另一个“家”。</p>

        <div class="grid">
            <div class="card">
                <div class="card-icon">🍎</div>
                <div class="card-title">线上英语课</div>
                <div class="card-desc">ESL 分级测试，一对一私教或小班授课，让语言不再是门槛。</div>
            </div>
            <div class="card">
                <div class="card-icon">🛂</div>
                <div class="card-title">签证与监护</div>
                <div class="card-desc">十年办理经验，从学签到监护人服务，给家长最安心的托付。</div>
            </div>
            <div class="card">
                <div class="card-icon">📍</div>
                <div class="card-title">留学黄页</div>
                <div class="card-desc">精选租房、租车与校园周边信息，帮你快速融入加拿大生活。</div>
            </div>
            <div class="card">
                <div class="card-icon">🏡</div>
                <div class="card-title">寄宿家庭</div>
                <div class="card-desc">严格筛选 Home Stay，确保环境安全、温馨且充满关怀。</div>
            </div>
        </div>

        <a href="#" class="btn">开始咨询</a>
    </div>

</body>
</html>
